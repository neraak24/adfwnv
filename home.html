<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="index.css" />
    <title>Teste Arranjo de Figuras</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
    <style>
      body {
        background: linear-gradient(160deg, #fff6c9 0%, #cbf1ba 45%, #bfe9ff 100%);
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        font-family: 'Baloo 2', sans-serif;
      }
      .balao {
        position: absolute;
        font-size: 2.3rem;
        opacity: 0.85;
        animation: flutuar 6s ease-in-out infinite;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
      }
      @keyframes flutuar {
        0%, 100% { transform: translateY(0) rotate(-4deg); }
        50% { transform: translateY(-20px) rotate(4deg); }
      }
      .sol {
        position: absolute;
        top: 6%;
        font-size: 3rem;
        animation: brilhar 3s ease-in-out infinite;
      }
      @keyframes brilhar {
        0%, 100% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.1) rotate(15deg); }
      }
      .cartao {
        background: #fffdf6;
        border-radius: 32px;
        padding: 44px 46px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(0,0,0,0.12);
        border: 5px dashed #ffd166;
        position: relative;
        z-index: 2;
      }
      .title {
        font-size: 2rem;
        color: #3a6b3a;
        margin-bottom: 6px;
      }
      .subtitle {
        font-size: 1rem;
        color: #7a9a7a;
        margin-bottom: 26px;
      }
      .linkinicio {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(145deg, #ffe28a, #ffb703);
        padding: 18px;
        border-radius: 50%;
        box-shadow: 0 10px 22px rgba(255, 183, 3, 0.45);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        animation: pulsar 2.4s ease-in-out infinite;
      }
      .linkinicio:hover {
        transform: scale(1.12) rotate(-4deg);
        box-shadow: 0 14px 28px rgba(255, 183, 3, 0.6);
      }
      @keyframes pulsar {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      .linkinicio img {
        height: auto;
        width: 70px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="sol" style="left:8%;">☀️</div>
    <div class="balao" style="top:12%; right:10%;">🎈</div>
    <div class="balao" style="bottom:14%; left:9%; animation-delay:2s;">🦋</div>
    <div class="balao" style="bottom:18%; right:12%; animation-delay:0.8s;">🌈</div>
    <div class="balao" style="top:20%; left:20%; animation-delay:1.4s; font-size:1.6rem;">⭐</div>
    <div class="balao" style="bottom:10%; right:24%; animation-delay:2.6s; font-size:1.6rem;">✨</div>

    <div class="cartao">
      <p class="subtitle">Toque no botão para começar!</p>
      <div class="linkContainer.inicio">
        <a class="linkinicio" href="./page1.html">
          <img
            src="./outros/botaoinicial.png"
            alt="próximo.inicio"
          />
        </a>
      </div>
    </div>

    <script>
      if (sessionStorage.getItem("categkids_ok") !== "1") {
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
