<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="index.css" />
    <title>Teste Arranjo de Figuras</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
    <style>
      body {
        background: linear-gradient(135deg, #cbf1ba, #bfe9ff);
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .title {
        font-size: 2.2rem;
        text-align: center;
        font-family: 'Baloo 2', sans-serif;
        color: #3a6b3a;
        margin-bottom: 30px;
      }
      .balao {
        position: absolute;
        font-size: 2.2rem;
        opacity: 0.8;
        animation: flutuar 6s ease-in-out infinite;
      }
      @keyframes flutuar {
        0%, 100% { transform: translateY(0) rotate(-4deg); }
        50% { transform: translateY(-20px) rotate(4deg); }
      }
      .linkinicio {
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.2s ease;
      }
      .linkinicio:hover {
        transform: scale(1.08);
      }
      .linkinicio img {
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="balao" style="top:10%; left:12%;">🌟</div>
    <div class="balao" style="top:14%; right:10%; animation-delay:1.2s;">🎈</div>
    <div class="balao" style="bottom:12%; left:10%; animation-delay:2s;">🦋</div>
    <div class="balao" style="bottom:16%; right:12%; animation-delay:0.6s;">🌈</div>

    <h1 class="title">Vamos brincar? 🧩</h1>
    <div class="linkContainer.inicio">
      <a class="linkinicio" href="./page1.html">
        <img
          src="./outros/botaoinicial.png"
          alt="próximo.inicio"
          width="20%"
        />
      </a>
    </div>

    <script>
      if (sessionStorage.getItem("categkids_ok") !== "1") {
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
