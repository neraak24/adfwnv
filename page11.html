<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="index.css">
  <title>Teste Arranjo de Figuras</title>
</head>

<body>

  <div class="container">
      <img src="./quebra/quebra1.png" alt="drag-and-drop image script" title="drag-and-drop image script" class="dragme" data-order="1">
      <img src="./quebra/quebra2.png" alt="drag-and-drop image script" title="drag-and-drop image script" class="dragme" data-order="2" data-scale="1.0976">
      <img src="./quebra/quebra3.png" alt="drag-and-drop image script" title="drag-and-drop image script" class="dragme" data-order="3">
      <img src="./quebra/quebra4.png" alt="drag-and-drop image script" title="drag-and-drop image script" class="dragme" data-order="4" data-scale="1.0976">
      <img src="./quebra/quebra5.png" alt="drag-and-drop image script" title="drag-and-drop image script" class="dragme" data-order="5">
      <img src="./quebra/quebra6.png" alt="drag-and-drop image script" title="drag-and-drop image script" class="dragme" data-order="6">
  </div>

  <div class="linkContainer">
    <a class="link" href="./page12.html">
      <img src="./outros/7604747.png" width="45%" alt="próximo">
    </a>
  </div>

<script>
let highestZ = 10;
let drag = false;
let dragTarget = null;
let offsetX, offsetY, coordX, coordY;
let cards = [];
let slots = [];

function calcularSlots() {
  const baseCardWidth = 230;
  const gapX = 44;
  const gapY = 210;
  const margem = 60;
  const startY = 150;

  const n = cards.length;
  const rows = n > 4 ? 2 : 1;
  const cols = Math.ceil(n / rows);

  // largura da carta: só reduz se não couber na tela
  let cardWidth = baseCardWidth;
  const larguraNecessaria = cols * cardWidth + (cols - 1) * gapX + margem;
  if (larguraNecessaria > window.innerWidth) {
    cardWidth = Math.max(150, (window.innerWidth - margem - (cols - 1) * gapX) / cols);
  }
  cards.forEach(function (c) {
    var fator = parseFloat(c.dataset.scale) || 1;
    c.style.width = (cardWidth * fator) + "px";
  });

  slots = [];
  var restante = n;
  for (var r = 0; r < rows; r++) {
    var itensNaLinha = Math.min(cols, restante);
    var larguraLinha = itensNaLinha * cardWidth + (itensNaLinha - 1) * gapX;
    var startX = (window.innerWidth - larguraLinha) / 2;
    for (var c2 = 0; c2 < itensNaLinha; c2++) {
      slots.push({ x: startX + c2 * (cardWidth + gapX), y: startY + r * gapY });
    }
    restante -= itensNaLinha;
  }
  return { cardWidth: cardWidth, rows: rows };
}

function numerarSlots(rows, cardWidth) {
  // Caixa do tamanho da carta atrás de cada posição, com o número no
  // canto — mostra onde cada carta pode ir e a ordem de leitura.
  var container = document.querySelector(".container");
  slots.forEach(function (s, i) {
    var caixa = document.createElement("div");
    caixa.className = "slot-caixa";
    caixa.style.left = s.x + "px";
    caixa.style.top = s.y + "px";
    caixa.style.width = cardWidth + "px";
    caixa.style.height = cardWidth + "px";

    var numero = document.createElement("div");
    numero.className = "slot-numero";
    numero.textContent = i + 1;
    caixa.appendChild(numero);

    container.appendChild(caixa);
  });
}

function startDrag(e) {
  if (!e) e = window.event;
  if (e.preventDefault) e.preventDefault();

  let targ = e.target ? e.target : e.srcElement;
  if (!targ.classList.contains("dragme")) return;

  dragTarget = targ;
  dragTarget.style.zIndex = ++highestZ;

  offsetX = e.clientX;
  offsetY = e.clientY;

  coordX = parseInt(dragTarget.style.left || 0);
  coordY = parseInt(dragTarget.style.top || 0);

  drag = true;
}

function dragDiv(e) {
  if (!drag || !dragTarget) return;
  if (!e) e = window.event;

  dragTarget.style.left = coordX + e.clientX - offsetX + "px";
  dragTarget.style.top  = coordY + e.clientY - offsetY + "px";
}

let snapThreshold = 140;

function stopDrag() {
  if (dragTarget) {
    var curX = parseInt(dragTarget.style.left || 0);
    var curY = parseInt(dragTarget.style.top || 0);
    var melhorIdx = -1, melhorDist = 99999;
    slots.forEach(function (s, idx) {
      var d = Math.hypot(curX - s.x, curY - s.y);
      if (d < melhorDist) { melhorDist = d; melhorIdx = idx; }
    });
    if (melhorIdx !== -1 && melhorDist < snapThreshold) {
      var slotAtual = dragTarget.dataset.slot;
      var ocupante = null;
      cards.forEach(function (c) {
        if (c !== dragTarget && String(c.dataset.slot) === String(melhorIdx)) ocupante = c;
      });
      if (ocupante) {
        ocupante.dataset.slot = slotAtual;
        ocupante.style.left = slots[slotAtual].x + "px";
        ocupante.style.top = slots[slotAtual].y + "px";
      }
      dragTarget.dataset.slot = melhorIdx;
      dragTarget.style.left = slots[melhorIdx].x + "px";
      dragTarget.style.top = slots[melhorIdx].y + "px";
    }
  }
  drag = false;
  dragTarget = null;
}

window.onload = function () {
  document.addEventListener("mousedown", startDrag);
  document.addEventListener("mousemove", dragDiv);
  document.addEventListener("mouseup", stopDrag);

  cards = Array.from(document.querySelectorAll(".dragme"));
  var resultado = calcularSlots();
  snapThreshold = resultado.cardWidth * 0.6;
  numerarSlots(resultado.rows, resultado.cardWidth);

  cards.forEach(function (img, i) {
    img.dataset.slot = i;
    img.style.left = slots[i].x + "px";
    img.style.top  = slots[i].y + "px";
  });
};
</script>

<script>
(function () {
  var HUB_URL = "https://bjzmlvsskhfrkvblvsjj.supabase.co";
  var HUB_KEY = "sb_publishable_YEHAM35S4jsY_dKoN5mwzg_YOVoVWJR";
  var token = sessionStorage.getItem("hub_token");

  function nomeEtapa() {
    var arq = location.pathname.split("/").pop().replace(".html", "");
    return arq || "home";
  }

  function coletarSequenciaFinal() {
    var cartas = Array.from(document.querySelectorAll(".dragme"));
    if (!cartas.length) return null;
    cartas.sort(function (a, b) {
      return parseInt(a.dataset.slot || 0) - parseInt(b.dataset.slot || 0);
    });
    var sequencia = cartas.map(function (img) {
      return img.getAttribute("data-order");
    });
    return { tipo: "sequencia", ordem_final: sequencia };
  }

  function capturarPrint() {
    if (!token) return Promise.resolve();
    var dados_cubo = coletarSequenciaFinal();
    return fetch(HUB_URL + "/functions/v1/registrar-print", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": HUB_KEY },
      body: JSON.stringify({ token: token, etapa: nomeEtapa(), dados_cubo: dados_cubo })
    }).catch(function (e) {
      console.log("Erro ao registrar resultado:", e);
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    var links = document.querySelectorAll(".linkContainer a.link, a.link");
    links.forEach(function (a) {
      a.addEventListener("click", function (ev) {
        if (!token) return;
        ev.preventDefault();
        var destino = a.getAttribute("href");
        capturarPrint().then(function () {
          window.location.href = destino;
        }).catch(function () {
          window.location.href = destino;
        });
      });
    });
  });

  if (token) {
    var btnEncerrar = document.createElement("button");
    btnEncerrar.textContent = "encerrar teste";
    btnEncerrar.style.cssText = "position:fixed;bottom:8px;left:8px;z-index:99999;background:rgba(255,255,255,0.7);color:#3a6b3a;border:1px solid rgba(58,107,58,0.4);border-radius:5px;padding:4px 9px;font-size:11px;font-family:sans-serif;cursor:pointer;opacity:0.55;transition:opacity 0.2s;";
    btnEncerrar.addEventListener("mouseenter", function () { btnEncerrar.style.opacity = "1"; });
    btnEncerrar.addEventListener("mouseleave", function () { btnEncerrar.style.opacity = "0.55"; });
    btnEncerrar.addEventListener("click", function () {
      if (!confirm("Encerrar o teste agora? Esse link não poderá mais ser usado depois.")) return;
      btnEncerrar.disabled = true;
      btnEncerrar.textContent = "salvando...";
      capturarPrint().then(function () {
        return fetch(HUB_URL + "/functions/v1/concluir-sessao", {
          method: "POST",
          headers: { "Content-Type": "application/json", "apikey": HUB_KEY },
          body: JSON.stringify({ token: token })
        });
      }).catch(function () {}).then(function () {
        document.body.innerHTML = "<div style='min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:1.2rem;color:#333;text-align:center;padding:20px;background:#fff;'>Teste concluído. Obrigado!</div>";
        sessionStorage.clear();
      });
    });
    document.body.appendChild(btnEncerrar);
  }

  if (sessionStorage.getItem("categkids_ok") !== "1") {
    window.location.href = "index.html";
  }
})();
</script>

</body>
</html>
