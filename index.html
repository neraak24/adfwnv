<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Baloo 2', 'Comic Sans MS', sans-serif; }
  body {
    height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #ffe9a8, #ffc7e0, #b8e8ff);
    background-size: 200% 200%;
    animation: gradiente 10s ease infinite;
    color:#3a3a3a;
    overflow: hidden;
    position: relative;
  }
  @keyframes gradiente {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .balao {
    position: absolute;
    font-size: 2.4rem;
    opacity: 0.85;
    animation: flutuar 6s ease-in-out infinite;
  }
  @keyframes flutuar {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-22px) rotate(4deg); }
  }
  .box {
    background:#fff; padding:44px 38px; border-radius:28px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.15);
    width: 320px; text-align:center;
    position: relative;
    z-index: 2;
    border: 4px solid #ffd166;
  }
  h1 { font-size:1.5rem; font-weight:700; margin-bottom:8px; color:#4a4a4a; }
  p { font-size:0.95rem; color:#777; margin-bottom:10px; }
  .msg { margin-top:16px; font-size:0.95rem; color:#e0576b; min-height:20px; font-weight:600; }
  .spinner {
    display:flex; gap:8px; justify-content:center;
    margin:20px auto 4px;
  }
  .spinner span {
    width:14px; height:14px; border-radius:50%;
    background: linear-gradient(145deg, #ffb703, #fb8500);
    animation: pular 1s ease-in-out infinite;
  }
  .spinner span:nth-child(2) { animation-delay: 0.15s; background: linear-gradient(145deg, #06d6a0, #05a678); }
  .spinner span:nth-child(3) { animation-delay: 0.3s; background: linear-gradient(145deg, #4cc9f0, #3a86ff); }
  @keyframes pular {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }
</style>
</head>
<body>

  <div class="balao" style="top:8%; left:10%;">🎈</div>
  <div class="balao" style="top:15%; right:12%; animation-delay:1.5s;">⭐</div>
  <div class="balao" style="bottom:12%; left:14%; animation-delay:0.8s;">🌈</div>
  <div class="balao" style="bottom:18%; right:10%; animation-delay:2.2s;">🎨</div>

  <div class="box">
    <h1 id="titulo">✨ Só um instantinho...</h1>
    <p id="subtitulo">Estamos preparando tudo pra você!</p>
    <div class="spinner" id="spinner"><span></span><span></span><span></span></div>
    <div class="msg" id="msg"></div>
  </div>

<script>
const DESTINO = "home.html";
const SITE = "adfwnv";
const SUPABASE_URL = "https://bjzmlvsskhfrkvblvsjj.supabase.co";
const SUPABASE_KEY = "sb_publishable_YEHAM35S4jsY_dKoN5mwzg_YOVoVWJR";

const titulo = document.getElementById("titulo");
const subtitulo = document.getElementById("subtitulo");
const spinner = document.getElementById("spinner");
const msg = document.getElementById("msg");

function mostrarErro(texto) {
  spinner.style.display = "none";
  titulo.textContent = "🔒 Ops!";
  subtitulo.textContent = "Não conseguimos abrir a brincadeira.";
  msg.textContent = texto;
}

async function validarToken(token) {
  try {
    const resp = await fetch(SUPABASE_URL + "/functions/v1/validar-token", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY },
      body: JSON.stringify({ token, site: SITE })
    });
    const data = await resp.json();

    if (data.ok) {
      sessionStorage.setItem("categkids_ok", "1");
      sessionStorage.setItem("hub_token", token);
      sessionStorage.setItem("hub_sessao_id", data.sessao_id);
      window.location.href = DESTINO;
      return;
    }

    mostrarErro(data.motivo || "Link inválido ou expirado.");
  } catch (e) {
    mostrarErro("Erro ao verificar o link. Tente novamente.");
  }
}

const params = new URLSearchParams(window.location.search);
const token = params.get("t");

if (token) {
  validarToken(token);
} else {
  mostrarErro("O acesso a este site é feito apenas por um link individual.");
}
</script>

</body>
</html>
