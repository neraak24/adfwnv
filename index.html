<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', Arial, sans-serif; }
  body {
    height:100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #f7f6f3, #eae7e2);
    color:#1a1a1a;
  }
  .box {
    background:#fff; padding:40px 36px; border-radius:18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    width: 320px; text-align:center;
  }
  h1 { font-size:1.3rem; font-weight:600; margin-bottom:6px; }
  p { font-size:0.85rem; color:#666; margin-bottom:8px; }
  .msg { margin-top:14px; font-size:0.85rem; color:#c0392b; min-height:18px; }
  .spinner {
    width:28px; height:28px; margin:18px auto 0;
    border:3px solid #ddd; border-top-color:#222; border-radius:50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="box">
    <h1 id="titulo">🔒 Verificando acesso</h1>
    <p id="subtitulo">Só um instante...</p>
    <div class="spinner" id="spinner"></div>
    <div class="msg" id="msg"></div>
  </div>

<script>
const DESTINO = "home.html";
const SITE = "adfwnv";
const SUPABASE_URL = "https://bjzmlvsskhfrkvblvsjj.supabase.co";
const SUPABASE_KEY = "sb_publishable_YEHAM35S4jsY_dKoN5mwzg_YOVoVWJR";

const titulo = document.getElementById("titulo");
const subtitulo = document.getElementById("subtitulo");
const spinner = document.getElementById("spinner");
const msg = document.getElementById("msg");

function mostrarErro(texto) {
  spinner.style.display = "none";
  titulo.textContent = "🔒 Acesso restrito";
  subtitulo.textContent = "Não foi possível liberar a entrada.";
  msg.textContent = texto;
}

async function validarToken(token) {
  try {
    const resp = await fetch(SUPABASE_URL + "/functions/v1/validar-token", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY },
      body: JSON.stringify({ token, site: SITE })
    });
    const data = await resp.json();

    if (data.ok) {
      sessionStorage.setItem("categkids_ok", "1");
      sessionStorage.setItem("hub_token", token);
      sessionStorage.setItem("hub_sessao_id", data.sessao_id);
      window.location.href = DESTINO;
      return;
    }

    mostrarErro(data.motivo || "Link inválido ou expirado.");
  } catch (e) {
    mostrarErro("Erro ao verificar o link. Tente novamente.");
  }
}

const params = new URLSearchParams(window.location.search);
const token = params.get("t");

if (token) {
  validarToken(token);
} else {
  mostrarErro("O acesso a este site é feito apenas por um link individual.");
}
</script>

</body>
</html>
