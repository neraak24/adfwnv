<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="index.css">
  <title>Teste Arranjo de Figuras</title>
</head>

<body>

  <h1 class="title">Arraste a imagem na ordem correta</h1>

  <div class="container">
      <img src="./nadar/nadar1.png" alt="drag-and-drop image script" title="drag-and-drop image script" class="dragme" data-order="1">
      <img src="./nadar/nadar2.png" alt="drag-and-drop image script" title="drag-and-drop image script" class="dragme" data-order="2">
      <img src="./nadar/nadar3.png" alt="drag-and-drop image script" title="drag-and-drop image script" class="dragme" data-order="3">
      <img src="./nadar/nadar4.png" alt="drag-and-drop image script" title="drag-and-drop image script" class="dragme" data-order="4">
      <img src="./nadar/nadar5.png" alt="drag-and-drop image script" title="drag-and-drop image script" class="dragme" data-order="5">
  </div>


<script>
let highestZ = 1;
let drag = false;
let dragTarget = null;
let offsetX, offsetY, coordX, coordY;
let cards = [];
let slots = [];

function calcularSlots() {
  const cardWidth = 246;
  const maxSpacing = 280;
  const minSpacing = 150;
  const margem = 60;
  const disponivel = window.innerWidth - margem;
  let spacingX = Math.min(maxSpacing, disponivel / cards.length);
  spacingX = Math.max(minSpacing, spacingX);

  // se o espaçamento ficar menor que a carta, reduz a largura das cartas
  const largura = spacingX < cardWidth + 16 ? Math.max(140, spacingX - 16) : cardWidth;
  cards.forEach(function (c) {
    var fator = parseFloat(c.dataset.scale) || 1;
    c.style.width = (largura * fator) + "px";
  });

  const totalWidth = spacingX * (cards.length - 1) + largura;
  const startX = (window.innerWidth - totalWidth) / 2;
  const startY = 180;

  slots = [];
  cards.forEach(function (img, i) {
    slots.push({ x: startX + i * spacingX, y: startY });
  });
  return spacingX;
}

function startDrag(e) {
  if (!e) e = window.event;
  if (e.preventDefault) e.preventDefault();

  let targ = e.target ? e.target : e.srcElement;
  if (!targ.classList.contains("dragme")) return;

  dragTarget = targ;
  dragTarget.style.zIndex = ++highestZ;

  offsetX = e.clientX;
  offsetY = e.clientY;

  coordX = parseInt(dragTarget.style.left || 0);
  coordY = parseInt(dragTarget.style.top || 0);

  drag = true;
}

function dragDiv(e) {
  if (!drag || !dragTarget) return;
  if (!e) e = window.event;

  dragTarget.style.left = coordX + e.clientX - offsetX + "px";
  dragTarget.style.top  = coordY + e.clientY - offsetY + "px";
}

let snapThreshold = 140;

function stopDrag() {
  if (dragTarget) {
    var curX = parseInt(dragTarget.style.left || 0);
    var curY = parseInt(dragTarget.style.top || 0);
    var melhorIdx = -1, melhorDist = 99999;
    slots.forEach(function (s, idx) {
      var d = Math.hypot(curX - s.x, curY - s.y);
      if (d < melhorDist) { melhorDist = d; melhorIdx = idx; }
    });
    if (melhorIdx !== -1 && melhorDist < snapThreshold) {
      var slotAtual = dragTarget.dataset.slot;
      var ocupante = null;
      cards.forEach(function (c) {
        if (c !== dragTarget && String(c.dataset.slot) === String(melhorIdx)) ocupante = c;
      });
      if (ocupante) {
        ocupante.dataset.slot = slotAtual;
        ocupante.style.left = slots[slotAtual].x + "px";
        ocupante.style.top = slots[slotAtual].y + "px";
      }
      dragTarget.dataset.slot = melhorIdx;
      dragTarget.style.left = slots[melhorIdx].x + "px";
      dragTarget.style.top = slots[melhorIdx].y + "px";
    }
  }
  drag = false;
  dragTarget = null;
}

window.onload = function () {
  document.addEventListener("mousedown", startDrag);
  document.addEventListener("mousemove", dragDiv);
  document.addEventListener("mouseup", stopDrag);

  cards = Array.from(document.querySelectorAll(".dragme"));
  var spacing = calcularSlots();
  snapThreshold = spacing * 0.55;

  cards.forEach(function (img, i) {
    img.dataset.slot = i;
    img.style.left = slots[i].x + "px";
    img.style.top  = slots[i].y + "px";
  });
};
</script>

<script>
(function () {
  var HUB_URL = "https://bjzmlvsskhfrkvblvsjj.supabase.co";
  var HUB_KEY = "sb_publishable_YEHAM35S4jsY_dKoN5mwzg_YOVoVWJR";
  var token = sessionStorage.getItem("hub_token");

  function nomeEtapa() {
    var arq = location.pathname.split("/").pop().replace(".html", "");
    return arq || "home";
  }

  function coletarSequenciaFinal() {
    var cartas = Array.from(document.querySelectorAll(".dragme"));
    if (!cartas.length) return null;
    cartas.sort(function (a, b) {
      return parseInt(a.dataset.slot || 0) - parseInt(b.dataset.slot || 0);
    });
    var sequencia = cartas.map(function (img) {
      return img.getAttribute("data-order");
    });
    return { tipo: "sequencia", ordem_final: sequencia };
  }

  function capturarPrint() {
    if (!token) return Promise.resolve();
    var dados_cubo = coletarSequenciaFinal();
    return fetch(HUB_URL + "/functions/v1/registrar-print", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": HUB_KEY },
      body: JSON.stringify({ token: token, etapa: nomeEtapa(), dados_cubo: dados_cubo })

    });

        });

        document.body.innerHTML = "<div style='min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:1.2rem;color:#333;text-align:center;padding:20px;background:#fff;'>Teste concluído. Obrigado!</div>";
        sessionStorage.clear();
      });

    document.body.appendChild(btn);
  }

  if (sessionStorage.getItem("categkids_ok") !== "1") {
    window.location.href = "index.html";
  }
})();
</script>

</body>
